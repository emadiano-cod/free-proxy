name: Free Proxy Server

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install Cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
      - name: Install V2Ray
        run: |
          bash <(curl -L https://raw.githubusercontent.com/v2fly/fhs-install-v2ray/master/install-release.sh)
          
      - name: Configure V2Ray
        run: |
          sudo mkdir -p /usr/local/etc/v2ray
          cat > /tmp/config.json << 'EOF'
          {
            "inbounds": [{
              "port": 8080,
              "protocol": "vmess",
              "settings": {
                "clients": [{
                  "id": "b831381d-6324-4d53-ad4f-8cda48b30811",
                  "alterId": 0
                }]
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": {
                  "path": "/vmess"
                }
              }
            }],
            "outbounds": [{
              "protocol": "freedom"
            }]
          }
          EOF
          sudo mv /tmp/config.json /usr/local/etc/v2ray/config.json
          
      - name: Start V2Ray
        run: |
          sudo v2ray run -c /usr/local/etc/v2ray/config.json &
          sleep 5
          
      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://localhost:8080 --no-autoupdate &
          sleep 10
          
      - name: Keep Alive
        run: |
          echo "Proxy is running..."
          echo "Check the logs above for your tunnel URL (looks like: https://xxxxx.trycloudflare.com)"
          sleep 21600
